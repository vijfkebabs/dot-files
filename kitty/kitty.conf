# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# GitHub Dark Colorblind
include current-theme.conf
# END_KITTY_THEME
#===========================
# Base colors
background            #111C18
foreground            #C1C497
cursor                #D7C995
cursor_text_color     #111C18
selection_background  #C1C497
selection_foreground  #111C18

# Borders
active_border_color   #509475
inactive_border_color #53685B
window_border_width   2

# Tab bar
tab_bar_background    #111C18
active_tab_background #509475
active_tab_foreground #111C18
inactive_tab_background #23372B
inactive_tab_foreground #C1C497

# Normal colors
color0  #23372B
color1  #FF5345
color2  #549E6A
color3  #459451
color4  #509475
color5  #D2689C
color6  #2DD5B7
color7  #F6F5DD

# Bright colors
color8  #53685B
color9  #DB9F9C
color10 #63B07A
color11 #E5C736
color12 #ACD4CF
color13 #75BBB3
color14 #8CD3CB
color15 #9EEBB3

#===========================
font_family JetBrainsMono Nerd Font
font_size 11.0
background_opacity 0.6
kitty_mod ctrl+shift
enabled_layouts tall,*
window_margin_width 4
window_border_width 2pt
#background_image /path/to/image
#background_image_layout scaled 
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol ☕
#hide_window_decorations no
map ctrl+c send_text all \x03

# Jump directly to tabs 1–9:
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
